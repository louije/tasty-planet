<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Roulette</title>
  <meta name="description" content="A photorealistic 3D lottery machine that picks a random country from every nation on Earth.">
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Country Roulette</h1>
    <p class="ball-count" aria-live="polite">
      <span id="remaining-count">197</span> countries remaining
    </p>
  </header>

  <main class="layout">
    <!-- 3D Scene -->
    <section class="scene-panel" aria-label="Lottery machine">
      <canvas id="machine-canvas"></canvas>

      <div id="selection-overlay" class="selection-overlay hidden" role="alert" aria-live="assertive">
        <p class="selected-country-name" id="selected-name"></p>
        <p class="selected-country-continent" id="selected-continent"></p>
        <div class="selection-actions">
          <button id="btn-skip" class="btn btn--skip" type="button">Skip</button>
          <button id="btn-accept" class="btn btn--accept" type="button">Accept</button>
        </div>
      </div>

      <button id="btn-spin" class="btn btn--spin" type="button" aria-label="Spin the lottery machine">
        Spin
      </button>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <section class="accepted-section" aria-label="Accepted countries">
        <h2>Accepted</h2>
        <ol id="accepted-list" class="country-list country-list--accepted" aria-live="polite"></ol>
        <p id="accepted-empty" class="empty-msg">None yet — spin the machine!</p>
      </section>

      <section class="skipped-section" aria-label="Skipped countries">
        <h2>Skipped <span id="skipped-count" class="badge">0</span></h2>
        <details id="skipped-details">
          <summary>Show skipped</summary>
          <ul id="skipped-list" class="country-list country-list--skipped"></ul>
        </details>
      </section>

      <section class="tools-section">
        <button id="btn-reset" class="btn btn--reset" type="button">Reset all</button>
        <button id="btn-test-rng" class="btn btn--test" type="button">Test fairness</button>
        <output id="rng-output" class="rng-output" aria-live="polite"></output>
      </section>
    </aside>
  </main>

  <footer class="site-footer">
    <p>Selection uses <code>crypto.getRandomValues</code> for perfect fairness.</p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
